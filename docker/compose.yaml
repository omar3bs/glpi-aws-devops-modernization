name: glpi-modernization

services:
  glpi:
    build:
      context: .
      dockerfile: Dockerfile
    image: glpi-custom:dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:${GLPI_PORT:-8080}:8080"

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      TZ: ${TZ:-UTC}
      GLPI_AUTO_INSTALL: ${GLPI_AUTO_INSTALL:-false}

    volumes:
      - glpi_config:/var/www/glpi/config
      - glpi_files:/var/www/glpi/files
      - glpi_plugins:/var/www/glpi/plugins
      - glpi_marketplace:/var/www/glpi/marketplace

    depends_on:
      glpi-db:
        condition: service_healthy

    networks:
      - glpi_network

  glpi-db:
    image: mariadb:11.8.6@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Root password required}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Database password required}
      TZ: ${TZ:-UTC}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - glpi_network

volumes:
  glpi_config:
  glpi_files:
  glpi_plugins:
  glpi_marketplace:
  db_data:

networks:
  glpi_network:
    driver: bridge