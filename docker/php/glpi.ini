; GLPI PHP configuration

; Resource limits
memory_limit = 512M
max_execution_time = 180
max_input_time = 180

; File uploads
file_uploads = On
upload_max_filesize = 50M
post_max_size = 64M

; Timezone
date.timezone = UTC

; PCRE compatibility
pcre.jit = 0

; Error handling
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Session security
session.cookie_httponly = On
session.use_strict_mode = On

; Performance
opcache.enable = 1
opcache.memory_consumption = 128

; Security
expose_php = Off